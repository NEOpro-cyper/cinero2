# ══════════════════════════════════════════════════════════════════
#  P-Stream SPA nginx config
#  - Serves the static Vite build from /usr/share/nginx/html
#  - Falls back to /index.html for all unknown routes (SPA routing)
#  - Long-cache fingerprinted assets under /assets/
#  - Never caches index.html, config.js, or service worker files
#  - Adds basic security + CORS headers for the custom API servers
# ══════════════════════════════════════════════════════════════════

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 20m;

    # Gzip everything text-y
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/manifest+json
        font/woff
        font/woff2
        image/svg+xml;

    # Upstream streaming APIs that don't send CORS headers themselves.
    # We proxy them through nginx so the browser can read the responses.
    # Uncomment / edit if your custom servers need server-side CORS proxying.
    #
    # server {
    #     listen 8000;
    #     server_name _;
    #     location /proxy/ {
    #         proxy_pass $arg_url;
    #         proxy_set_header Host $proxy_host;
    #         proxy_set_header Referer $arg_referer;
    #         proxy_ssl_server_name on;
    #         add_header Access-Control-Allow-Origin "*" always;
    #     }
    # }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Never cache index.html, config.js, manifest, or service worker
        location = /index.html {
            add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate";
        }
        location = /config.js {
            add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate";
        }
        location = /manifest.json {
            add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate";
            add_header Content-Type "application/manifest+json";
        }
        location = /sw.js {
            add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate";
        }
        location = /workbox-*.js {
            add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate";
        }

        # Long-cache fingerprinted assets
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
            try_files $uri =404;
        }

        # Static files (favicons, splash screens, etc.)
        location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|css|js|map)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
            try_files $uri =404;
        }

        # SPA fallback: serve index.html for everything else
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
